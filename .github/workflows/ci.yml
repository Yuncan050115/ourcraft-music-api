name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Boot smoke test
        run: |
          # ADAPTER_PORT defaults to 3017; /api?action=health must answer.
          node server.js >/tmp/server.log 2>&1 &
          pid=$!
          for i in $(seq 1 15); do
            if curl -fsS 'http://127.0.0.1:3017/api?action=health' >/dev/null; then
              echo "health OK after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:3017/api?action=health' || { cat /tmp/server.log; exit 1; }
          kill $pid
